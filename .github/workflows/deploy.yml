name: Déploiement continu (push sur main)

on:
  push:
    branches:
      - main

# Empêche deux déploiements Hostinger simultanés (avec le workflow de mise à
# jour des prix carburant qui déploie aussi) : les runs se mettent en file
# plutôt que de se chevaucher sur le même dossier public_html.
concurrency:
  group: hostinger-deploy
  cancel-in-progress: false

jobs:
  deploy:
    uses: ./.github/workflows/deploy-hostinger.yml
    secrets: inherit
