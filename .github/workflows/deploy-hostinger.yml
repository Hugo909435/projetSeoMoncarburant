name: Build et déploiement Hostinger (réutilisable)

on:
  workflow_call:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Installation des dépendances
        run: npm ci

      - name: Build Astro
        run: npx astro build
        env:
          NODE_ENV: production

      - name: Déploiement vers Hostinger
        timeout-minutes: 15
        env:
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_HOST: ${{ secrets.FTP_HOST }}
        run: |
          sudo apt-get install -y --no-install-recommends lftp
          # Identifiants passés en variables d'env (pas dans l'URL) : évite
          # qu'un caractère spécial dans le mot de passe (@ : / % # ...) casse
          # le parsing de l'URL ftp://user:pass@host et fausse le login.
          # Ce compte FTP est déjà enraciné dans le document root du site
          # (contrairement à l'ancien compte SFTP) : on mirror directement dans
          # le répertoire courant "." et pas dans domains/mon-carburant.com/public_html/,
          # qui n'existe pas ici. On supprime aussi le dossier "domains" créé
          # par erreur lors des runs précédents pendant qu'on cherchait le bon chemin.
          # Transferts FTP plus robustes : moins de parallélisme (évite les blocages
          # de connexions simultanées côté Hostinger) + timeouts et reconnexions.
          lftp -u "$FTP_USER","$FTP_PASSWORD" -p 21 \
               -e "set ftp:ssl-allow no; \
                   set ftp:passive-mode true; \
                   set net:timeout 30; \
                   set net:max-retries 6; \
                   set net:reconnect-interval-base 10; \
                   set net:reconnect-interval-multiplier 1.5; \
                   set net:persist-retries 5; \
                   set mirror:parallel-transfer-count 2; \
                   set mirror:parallel-directories no; \
                   rm -r -f domains; \
                   lcd dist; \
                   mirror -R --delete --verbose . .; \
                   quit" \
            "$FTP_HOST"
