name: Build et déploiement Hostinger (réutilisable)

on:
  workflow_call:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Installation des dépendances
        run: npm ci

      - name: Build Astro
        run: npx astro build
        env:
          NODE_ENV: production

      - name: Déploiement vers Hostinger
        timeout-minutes: 15
        env:
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_HOST: ${{ secrets.FTP_HOST }}
        run: |
          sudo apt-get install -y --no-install-recommends lftp
          # Identifiants passés en variables d'env (pas dans l'URL) : évite
          # qu'un caractère spécial dans le mot de passe (@ : / % # ...) casse
          # le parsing de l'URL ftp://user:pass@host et fausse le login.
          # DIAGNOSTIC TEMPORAIRE : le mirror est désactivé le temps de vérifier
          # dans quel répertoire on atterrit après connexion FTP (le compte FTP
          # n'a peut-être pas la même racine que l'ancien compte SFTP, ce qui
          # expliquerait pourquoi les derniers fichiers déployés n'apparaissent
          # pas sur le site malgré un run vert). À retirer une fois le bon
          # chemin de destination confirmé.
          lftp -u "$FTP_USER","$FTP_PASSWORD" -p 21 \
               -e "set ftp:ssl-allow no; \
                   set ftp:passive-mode true; \
                   set net:timeout 30; \
                   set net:max-retries 6; \
                   set net:reconnect-interval-base 10; \
                   set net:reconnect-interval-multiplier 1.5; \
                   set net:persist-retries 5; \
                   set mirror:parallel-transfer-count 2; \
                   set mirror:parallel-directories no; \
                   echo '--- pwd apres login ---'; \
                   pwd; \
                   echo '--- contenu du repertoire de connexion ---'; \
                   ls -la; \
                   echo '--- tentative de lister domains/ ---'; \
                   ls -la domains/; \
                   echo '--- tentative de lister public_html/ ---'; \
                   ls -la public_html/; \
                   quit" \
            "$FTP_HOST"
