name: Build et déploiement Hostinger (réutilisable)

on:
  workflow_call:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # Les fiches stations dépassent à elles seules vingt minutes de transfert.
    # Les phases ont leurs propres limites, dans un budget global borné.
    timeout-minutes: 75

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4
        with:
          # Inclure les derniers commits de prix des workflows de collecte.
          ref: main
          fetch-depth: 1

      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Installation des dépendances
        run: npm ci

      - name: Vérification du script de déploiement
        run: python3 scripts/test-deploy-hostinger.py

      - name: Installation des outils FTP
        run: sudo apt-get install -y --no-install-recommends lftp python3-pyftpdlib

      - name: Test de transfert FTP local
        run: /usr/bin/python3 scripts/test-deploy-hostinger-integration.py

      - name: Build Astro
        run: npx astro build
        env:
          NODE_ENV: production

      - name: Déploiement des ressources et pages principales
        timeout-minutes: 20
        env:
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_HOST: ${{ secrets.FTP_HOST }}
        run: bash scripts/deploy-hostinger.sh core

      - name: Déploiement des fiches stations
        timeout-minutes: 45
        env:
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_HOST: ${{ secrets.FTP_HOST }}
        run: bash scripts/deploy-hostinger.sh stations

      - name: Résumé du déploiement
        run: |
          echo '### Déploiement Hostinger terminé' >> "$GITHUB_STEP_SUMMARY"
          echo 'Ressources, pages principales et fiches stations publiées avec succès.' >> "$GITHUB_STEP_SUMMARY"
