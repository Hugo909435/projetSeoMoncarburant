name: Mise à jour quotidienne des prix carburant

on:
  schedule:
    # 6h00 heure de Paris (UTC+1/+2 selon saison) → 5h00 UTC en été / 4h00 UTC en hiver
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Forcer un rebuild même sans changement de données'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write

jobs:
  fetch-and-update:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Installation des dépendances
        run: npm ci

      - name: Récupération des données carburant
        id: fetch
        run: |
          node scripts/fetch-fuel-data.js
          echo "fetch_done=true" >> $GITHUB_OUTPUT

      - name: Vérification des changements
        id: check-changes
        run: |
          git diff --quiet src/data/fuel/ public/data/ && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit et push si données modifiées
        if: steps.check-changes.outputs.changed == 'true' || inputs.force_rebuild == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git pull origin main
          git add src/data/fuel/ public/data/stations-light.json last-update.txt
          git commit -m "chore: mise à jour prix carburant $(date +'%Y-%m-%d')"
          git push

      - name: Aucun changement détecté
        if: steps.check-changes.outputs.changed == 'false' && inputs.force_rebuild != 'true'
        run: echo "✅ Les données n'ont pas changé depuis la dernière mise à jour."

      - name: Build Astro
        if: steps.check-changes.outputs.changed == 'true' || inputs.force_rebuild == 'true'
        run: npx astro build
        env:
          NODE_ENV: production

      - name: Déploiement vers Hostinger
        if: steps.check-changes.outputs.changed == 'true' || inputs.force_rebuild == 'true'
        run: |
          sudo apt-get install -y --no-install-recommends lftp
          echo "--- Contenu du répertoire racine SFTP ---"
          lftp -e "set sftp:auto-confirm yes; ls; quit" \
            sftp://${{ secrets.FTP_USER }}:${{ secrets.FTP_PASSWORD }}@${{ secrets.FTP_HOST }}:65002
          echo "--- Déploiement ---"
          lftp -e "set sftp:auto-confirm yes; set mirror:parallel-transfer-count 5; set net:timeout 30; lcd dist; mirror -R --delete --verbose . public_html/; quit" \
            sftp://${{ secrets.FTP_USER }}:${{ secrets.FTP_PASSWORD }}@${{ secrets.FTP_HOST }}:65002
