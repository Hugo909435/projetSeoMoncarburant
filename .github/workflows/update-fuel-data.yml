name: Mise à jour quotidienne des prix carburant

on:
  schedule:
    # Toutes les 3h, en filet de sécurité (le flux gouvernemental /opendata/jour n'est
    # régénéré qu'une fois par jour ~minuit ; ce cadencement sert surtout à rattraper
    # un run manqué ou en échec, pas à obtenir une fraîcheur intra-journée).
    - cron: '0 */3 * * *'
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Forcer un rebuild même sans changement de données'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write

# Empêche deux déploiements Hostinger simultanés (avec le workflow de
# déploiement continu déclenché sur push) : les runs se mettent en file
# plutôt que de se chevaucher sur le même dossier public_html.
concurrency:
  group: hostinger-deploy
  cancel-in-progress: false

jobs:
  fetch-and-update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      changed: ${{ steps.check-changes.outputs.changed }}

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Installation des dépendances
        run: npm ci

      - name: Récupération des données carburant
        id: fetch
        run: |
          set -o pipefail
          node scripts/fetch-fuel-data.js 2>&1 | tee fetch-output.log
          if grep -q '^FETCH_STATUS=failed$' fetch-output.log; then
            echo "❌ Le téléchargement du flux gouvernemental a échoué (voir logs ci-dessus)."
            rm -f fetch-output.log
            exit 1
          fi
          rm -f fetch-output.log

      - name: Vérification des changements
        id: check-changes
        run: |
          git diff --quiet src/data/fuel/ public/data/ && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit et push si données modifiées
        if: steps.check-changes.outputs.changed == 'true' || inputs.force_rebuild == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git pull origin main
          git add src/data/fuel/ public/data/stations-light.json last-update.txt
          git commit -m "chore: mise à jour prix carburant $(date +'%Y-%m-%d %H:%M')"
          git push

      - name: Aucun changement détecté
        if: steps.check-changes.outputs.changed == 'false' && inputs.force_rebuild != 'true'
        run: echo "✅ Les données n'ont pas changé depuis la dernière mise à jour."

  deploy:
    needs: fetch-and-update
    if: needs.fetch-and-update.outputs.changed == 'true' || inputs.force_rebuild == 'true'
    uses: ./.github/workflows/deploy-hostinger.yml
    secrets: inherit
