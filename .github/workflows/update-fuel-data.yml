name: Mise à jour quotidienne des prix carburant

on:
  schedule:
    # Toutes les 3h, en filet de sécurité (le flux gouvernemental /opendata/jour n'est
    # régénéré qu'une fois par jour ~minuit ; ce cadencement sert surtout à rattraper
    # un run manqué ou en échec, pas à obtenir une fraîcheur intra-journée).
    - cron: '0 */3 * * *'
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Forcer un rebuild même sans changement de données'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write

# Empêche deux déploiements Hostinger simultanés (avec le workflow de
# déploiement continu déclenché sur push) : les runs se mettent en file
# plutôt que de se chevaucher sur le même dossier public_html.
concurrency:
  group: hostinger-deploy
  cancel-in-progress: false

jobs:
  fetch-and-update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: fetch-fuel-data
      cancel-in-progress: false
    outputs:
      changed: ${{ steps.check-changes.outputs.changed }}

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4
        with:
          # Le détecteur de prix coûtant compare les prix du jour à ceux d'il y
          # a 20h, en lisant l'état précédent directement dans l'historique des
          # commits de données. Un checkout superficiel le priverait de sa
          # référence. 60 commits couvrent largement la fenêtre, le workflow
          # tournant au plus 8 fois par jour.
          fetch-depth: 60

      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Installation des dépendances
        run: npm ci

      - name: Récupération des données carburant
        id: fetch
        run: |
          set -o pipefail
          node scripts/fetch-fuel-data.js 2>&1 | tee fetch-output.log
          if grep -q '^FETCH_STATUS=failed$' fetch-output.log; then
            echo "❌ Le téléchargement du flux gouvernemental a échoué (voir logs ci-dessus)."
            rm -f fetch-output.log
            exit 1
          fi
          rm -f fetch-output.log

      - name: Détection des opérations à prix coûtant
        # Repère les réseaux dont les stations décrochent massivement du marché,
        # signature d'une opération à prix coûtant. Non bloquant : une absence
        # d'historique ou un flux incomplet ne doit pas faire échouer le build.
        run: node scripts/detect-prix-coutant.js || echo "Détection ignorée."

      - name: Planification des vagues de pages station
        # Affecte les stations nouvellement apparues dans l'open data à une
        # vague future, et bascule à l'état publié les vagues dont la date est
        # atteinte. Le fichier n'est réécrit que si le plan change réellement,
        # pour ne pas déclencher un déploiement quotidien sans raison.
        run: node scripts/build-station-waves.js

      - name: Vérification des changements
        id: check-changes
        run: |
          git diff --quiet src/data/fuel/ public/data/ && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit et push si données modifiées
        if: steps.check-changes.outputs.changed == 'true' || inputs.force_rebuild == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add src/data/fuel/ public/data/stations-light.json last-update.txt
          git commit -m "chore: mise à jour prix carburant $(date +'%Y-%m-%d %H:%M')"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && break
            echo "Push refusé (tentative $i), nouvelle synchronisation..."
            sleep $((RANDOM % 10 + 1))
          done

      - name: Aucun changement détecté
        if: steps.check-changes.outputs.changed == 'false' && inputs.force_rebuild != 'true'
        run: echo "✅ Les données n'ont pas changé depuis la dernière mise à jour."

  deploy:
    needs: fetch-and-update
    if: needs.fetch-and-update.outputs.changed == 'true' || inputs.force_rebuild == 'true'
    uses: ./.github/workflows/deploy-hostinger.yml
    secrets: inherit
