services:
  postgres:
    image: postgres:16
    container_name: seo_site_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: seo_site_template
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
